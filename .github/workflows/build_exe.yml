name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame torch pyinstaller

      - name: Build standalone Windows EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "TicTacToe" --add-data "tictactoe_model.pth;." UI/main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Windows-EXE
          path: dist/TicTacToe.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame torch pyinstaller

      - name: Build standalone Linux Binary
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "TicTacToe-Linux" --add-data "tictactoe_model.pth:." UI/main.py
          chmod +x dist/TicTacToe-Linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Linux-App
          path: dist/TicTacToe-Linux
