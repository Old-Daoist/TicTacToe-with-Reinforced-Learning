name: Build Standalone Executables (Windows & Linux)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame numpy pyinstaller

      - name: Clean any cached bytecode
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Include __pycache__ -Recurse -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Build standalone Windows EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --paths UI --name "TicTacToe" --exclude-module torch --exclude-module sympy --exclude-module jinja2 --exclude-module networkx --exclude-module mpmath --add-data "tictactoe_model.pth;." --add-data "UI;UI" UI/main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Windows-EXE
          path: dist/TicTacToe.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame numpy pyinstaller

      - name: Clean any cached bytecode
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

      - name: Build standalone Linux Binary
        run: |
          pyinstaller --noconfirm --onefile --windowed --paths UI --name "TicTacToe-Linux" --exclude-module torch --exclude-module sympy --exclude-module jinja2 --exclude-module networkx --exclude-module mpmath --add-data "tictactoe_model.pth:." --add-data "UI:UI" UI/main.py
          chmod +x dist/TicTacToe-Linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Linux-App
          path: dist/TicTacToe-Linux

